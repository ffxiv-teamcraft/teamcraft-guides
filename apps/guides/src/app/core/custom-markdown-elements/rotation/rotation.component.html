<div class="tc-card-container">
  @if (rotationDisplay$ | async; as rotation) {
    @if (!rotation.notFound) {
      <div class="tc-card-title">
        <i nz-icon nzType="appstore-add" nzTheme="outline"></i> {{rotation.name}}
      </div>
      <div class="tc-card-content" fxLayout="row wrap" fxLayoutGap="5px">
        @for (action of rotation.actions; track action) {
          <guides-action [action]="action"></guides-action>
        }
      </div>
      <div class="tc-card-footer" fxLayout="row" fxLayoutGap="5px" fxLayoutAlign="flex-start center" fxShow fxHide.lt-md>
        <div>
          <a nz-button nzSize="small" href="https://ffxivteamcraft.com/{{rotation.link}}" target="_blank">Open in Teamcraft</a>
        </div>
        <div>
          <nz-divider nzType="vertical"></nz-divider>
        </div>
        <div fxLayout="row" fxLayoutGap="5px">
          @for (fragment of rotation.macro; track fragment; let i = $index) {
            <button nz-button nzSize="small"
              (click)="copyMacro(fragment)">
              Copy macro #{{i + 1}}
            </button>
          }
        </div>
      </div>
    } @else {
      <div class="tc-card-content">
        <nz-empty nzNotFoundContent="Rotation not found"></nz-empty>
      </div>
    }
  }
</div>
