@if (map$ | async; as map) {
  <div class="tc-card-container map-card">
    <div class="tc-card-title">
      {{map.name?.en}}@if (map.name_sub) {
      <span> - {{map.name_sub.en}}</span>
      } (X: {{x}}, Y:{{y}})
    </div>
    <div class="map-container">
      <guides-map-position [map]="map" [x]="x" [y]="y">
      </guides-map-position>
    </div>
  </div>
}
